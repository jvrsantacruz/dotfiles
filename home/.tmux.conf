# Use caps lock as prefix
# Caps Lock is remapped to F9 in the kernel input layer by a udev hwdb rule,
# /etc/udev/hwdb.d/70-caps-f9.hwdb, installed by the keyboard role. By hand:
# the install-caps-f9 procedure in ~/notes/tech/Bible.
unbind-key c-b
set -g prefix F9
bind-key F9 send-prefix

# Fix problem with vim within tmux
set -s escape-time 0
set-window-option -g mode-keys vi

# Truecolor support (required for themes to use hex colors correctly)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Set scroll via mouse/touchpad
set -g mouse on

# Increase history limit
set-option -g history-limit 100000

# Window naming settings (Hybrid approach)
# - automatic-rename ON: tmux auto-names based on running command
# - When you manually rename (prefix + ,), automatic-rename turns OFF for that window
# - allow-rename OFF: programs can't override with escape sequences
set-option -g automatic-rename on   # Auto-name windows (default, explicit here)
set-option -g allow-rename off       # Block program escape sequences

set -g renumber-windows on    # renumber windows when a window is closed

# List of plugins
# Plugin management: <prefix> + I (install), <prefix> + U (update), <prefix> + alt+u (uninstall)
# And <prefix> + :source ~/.tmux.conf

set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-open'       # Press 'o' to open links
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'morantron/tmux-fingers'       # <prefix> + F: copy by hint
set -g @plugin 'tmux-plugins/tmux-logging'    # <prefix> + alt+p: log a pane
set -g @plugin 'tmux-plugins/tpm'

# Panes come back with their contents, not just their layout.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

# ---------------------------------------------------------------------------
# Budapest theme. The bar takes the terminal's own background and the palette
# slots, so it follows Ptyxis between Day and Night without switching here.
# Terracotta marks the active window and nothing else. Why:
# 2026-10-11-terminal-wears-budapest in the Bible.
# ---------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=default"

set -g status-interval 1
# Wide enough for the session name plus the dictation marker in front of it.
set -g status-left-length 60
set -g status-right-length 60
# The dictation marker leads, because it is the reason this bar is watched at
# all: a desktop notification does not draw over a fullscreen terminal, so this
# is the only place recording is visible. It prints nothing when idle, and
# dictate calls `refresh-client -S` on each transition so it does not wait for
# the next interval tick.
set -g status-left "#(dictate-status)#[bold] #S#[default] "
set -g status-right "#[fg=colour8]#{battery_icon} #{battery_percentage}  #[default]%H:%M:%S #[fg=colour8]%d-%b "

set -g window-status-format " #I:#W "
set -g window-status-style "fg=colour8"
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#a8432c,fg=#fff8ee,bold"
set -g window-status-activity-style "fg=colour3"
set -g window-status-separator ""

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=default"
set -g message-style "reverse"
set -g mode-style "reverse"
set -g clock-mode-colour "colour8"

# Saves every 15 minutes and restores the last save when the server starts, so
# a reboot or a flat battery costs at most 15 minutes of layout. Declared after
# the theme: it hooks into status-right, which the theme above sets.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Jump to previously selected window (last-window)
bind-key u last-window

# F9 + f: find any window across all sessions by name / index / running command
bind-key f display-popup -w 60% -h 40% -E "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name} [#{pane_current_command}]' | fzf --reverse --prompt='window> ' | cut -d' ' -f1 | xargs -r tmux switch-client -t"

# F9 + s: switch session by name (overrides default session tree)
bind-key s display-popup -w 60% -h 40% -E "tmux list-sessions -F '#{session_name}' | fzf --reverse --prompt='session> ' | xargs -r tmux switch-client -t"

# Open panes same directory
bind '"' split-window -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# Claude Code popup — persistent session, named by hash + human path label
# F9 + a: open/resume Claude in a floating popup, anchored to current directory
# Closing the popup suspends Claude; reopening resumes the same session.
# Session name: claude-<hash>-<parent>-<dirname>  e.g. claude-a3f2b1c8-datadog-dd-source
bind-key a run-shell '\
  CPATH="#{pane_current_path}"; \
  HASH=$(echo "$CPATH" | md5sum | cut -c1-8); \
  LABEL=$(printf "%s-%s" "$(basename $(dirname "$CPATH"))" "$(basename "$CPATH")" \
    | tr "[:upper:]" "[:lower:]" | tr "/. " "---" | cut -c1-30); \
  SESSION="claude-${HASH}-${LABEL}"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "$CPATH" "claude"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
