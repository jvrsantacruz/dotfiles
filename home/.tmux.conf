# Use caps lock as prefix
# Caps Lock is remapped to F9 in the kernel input layer by a udev hwdb rule,
# /etc/udev/hwdb.d/70-caps-f9.hwdb, installed by the keyboard role. By hand:
# the install-caps-f9 procedure in ~/notes/tech/Bible.
source-file ~/.config/tmux/keys.conf

# Fix problem with vim within tmux
set -s escape-time 0
set -g extended-keys on
set -g extended-keys-format csi-u

# Truecolor support (required for themes to use hex colors correctly)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Set scroll via mouse/touchpad
set -g mouse on

# Increase history limit
set-option -g history-limit 100000

# Window naming settings (Hybrid approach)
# - automatic-rename ON: tmux auto-names based on running command
# - When you manually rename (prefix + ,), automatic-rename turns OFF for that window
# - allow-rename OFF: programs can't override with escape sequences
set-option -g automatic-rename on   # Auto-name windows (default, explicit here)
set-option -g allow-rename off       # Block program escape sequences
# The name is the command in the pane and nothing else. Without this tmux
# uses its own default format, which walks into the shell wrapper and prints
# that instead of what is running. From the `mac` profile.
set-option -g automatic-rename-format "#{pane_current_command}"

set -g renumber-windows on    # renumber windows when a window is closed

source-file ~/.config/tmux/plugins.conf
set -g @plugin 'morantron/tmux-fingers'       # <prefix> + F: copy by hint
set -g @plugin 'tmux-plugins/tmux-logging'    # <prefix> + alt+p: log a pane

# ---------------------------------------------------------------------------
# Budapest theme. The bar takes the terminal's own background and the palette
# slots, so it follows Ptyxis between Day and Night without switching here.
# Terracotta marks the active window and nothing else. Why:
# 2026-10-11-terminal-wears-budapest in the Bible; slots: brand-terminal.
# ---------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=default"

set -g status-interval 1
# Wide enough for the session name plus the dictation marker in front of it.
set -g status-left-length 60
set -g status-right-length 60
# The dictation marker leads, because it is the reason this bar is watched at
# all: a desktop notification does not draw over a fullscreen terminal, so this
# is the only place recording is visible. It prints nothing when idle, and
# dictate calls `refresh-client -S` on each transition so it does not wait for
# the next interval tick.
set -g status-left "#(dictate-status)#[bold] #S#[default] "
set -g status-right "#[fg=colour8]#{battery_icon} #{battery_percentage}  #[default]%H:%M:%S #[fg=colour8]%d-%b "

set -g window-status-format " #I:#W "
set -g window-status-style "fg=colour8"
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#a8432c,fg=#fff8ee,bold"
set -g window-status-activity-style "fg=colour3"
set -g window-status-separator ""

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=default"
set -g message-style "reverse"
# Selection is the butter tile with the dark ink, AA on Day and on Night.
# Lowercase hex: tmux reads #F inside a style as the window flags.
set -g mode-style "bg=#f3e3b0,fg=#3a3a3a"
set -g clock-mode-colour "colour8"


# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
