<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  HiDPI font rendering for dlap (3840x2160 @ 13.3", integer scale 2).

  Subpixel rendering with the light LCD filter: keeps most of the crispness
  of rgba without the colour fringing of the default lcddefault filter,
  which reads as harsh at this pixel density.

  GNOME's font-antialiasing must be 'rgba' for this to take effect;
  'grayscale' there disables subpixel rendering regardless of this file.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias"  mode="assign"><bool>true</bool></edit>
    <edit name="rgba"       mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter"  mode="assign"><const>lcdlight</const></edit>
    <edit name="hinting"    mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"  mode="assign"><const>hintslight</const></edit>
  </match>
</fontconfig>
