# Prefix, bindings and copy mode shared by every machine.
# Each machine maps Caps Lock to F9 its own way.
unbind-key c-b
set -g prefix F9
bind-key F9 send-prefix

set-window-option -g mode-keys vi

# ---------------------------------------------------------------------------
# Fuzzy finders (fzf in a popup)
# ---------------------------------------------------------------------------
# F9 + f: find any window across all sessions by name / index / running command
bind-key f display-popup -w 60% -h 40% -E "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name} [#{pane_current_command}]' | fzf --reverse --prompt='window> ' | cut -d' ' -f1 | xargs -r tmux switch-client -t"

# F9 + s: switch session by name (overrides default session tree)
bind-key s display-popup -w 60% -h 40% -E "tmux list-sessions -F '#{session_name}' | fzf --reverse --prompt='session> ' | xargs -r tmux switch-client -t"

# F9 + W: send current pane into another window of this session, side by side
bind-key W display-popup -w 60% -h 40% -E "tmux list-windows -F '#{window_index} #{window_name}' | fzf --reverse --prompt='send pane to> ' | cut -d' ' -f1 | xargs -r -I{} tmux join-pane -h -t :{}"

# Jump to previously selected window (last-window)
bind-key u last-window

# Open panes same directory
bind '"' split-window -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# Archive current window to the shared "archive" session (recreated on demand)
# F9 + a: move current window into archive; refuses to move the last window
# run-shell expands the formats for the client that pressed the key; a nested
# tmux call cannot, it guesses the most recent session instead.
bind-key a run-shell '\
  if [ "#{session_name}" = archive ]; then \
    tmux display-message "already in archive"; \
  elif [ "#{session_windows}" -eq 1 ]; then \
    tmux display-message "refusing: last window of session"; \
  elif tmux has-session -t =archive 2>/dev/null; then \
    tmux move-window -s "#{window_id}" -t =archive:; \
  else \
    tmux new-session -d -s archive -n __anchor__; \
    tmux move-window -s "#{window_id}" -t =archive:; \
    tmux kill-window -t =archive:__anchor__; \
  fi'

# F9 + A: from archive, send current window back to the session you came from
# and follow it there; switching first keeps the client attached when the
# archive session empties.
bind-key A run-shell '\
  if [ "#{session_name}" != archive ]; then \
    tmux display-message "not in archive"; \
  elif [ -z "#{client_last_session}" ] || [ "#{client_last_session}" = archive ]; then \
    tmux display-message "no previous session to unarchive to"; \
  else \
    tmux switch-client -t "=#{client_last_session}"; \
    tmux move-window -s "#{window_id}" -t "=#{client_last_session}:"; \
    tmux select-window -t "#{window_id}"; \
  fi'
