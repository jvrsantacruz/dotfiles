# Use caps lock as prefix
# Caps Lock is remapped to F9 via hidutil LaunchAgent at ~/Library/LaunchAgents/com.user.capslock-remap.plist
# To apply manually: hidutil property --set '{"UserKeyMapping":[{"HIDKeyboardModifierMappingSrc":0x700000039,"HIDKeyboardModifierMappingDst":0x700000042}]}'
unbind-key c-b
set -g prefix F9
bind-key F9 send-prefix

# Fix problem with vim within tmux
set -s escape-time 0

# Truecolor support (required for themes to use hex colors correctly)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"

# Set scroll via mouse/touchpad
set -g mouse on

# Increase history limit
set-option -g history-limit 100000

# List of plugins
# Plugin management: <prefix> + I (install), <prefix> + U (update), <prefix> + alt+u (uninstall)
# And <prefix> + :source ~/.tmux.conf

set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'       # Press 'o' to open links
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'

# ---------------------------------------------------------------------------
# Light theme (tuned for a white terminal background)
# ---------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#e8e8ed,fg=#3c3c43"

set -g status-interval 1
set -g status-left-length 40
set -g status-right-length 60
set -g status-left " #[fg=#0a84ff,bold]#S#[default] "
set -g status-right "#[fg=#6c6c70]#{battery_icon} #{battery_percentage}  #[fg=#3c3c43]%H:%M:%S #[fg=#8e8e93]%d-%b "

set -g window-status-format " #I:#W "
set -g window-status-style "fg=#6c6c70"
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#0a84ff,fg=#ffffff,bold"
set -g window-status-activity-style "fg=#ff9500"
set -g window-status-separator ""

set -g pane-border-style "fg=#d1d1d6"
set -g pane-active-border-style "fg=#0a84ff"
set -g message-style "bg=#0a84ff,fg=#ffffff,bold"
set -g mode-style "bg=#b3d7ff,fg=#1c1c1e"
set -g clock-mode-colour "#0a84ff"

# ---------------------------------------------------------------------------
# Window naming
# ---------------------------------------------------------------------------
# Apps cannot rename windows via escape sequences (stops Claude/vim title churn)
set -g allow-rename off
# tmux names windows itself from the running command; changes only on command change
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
# A manual rename (F9 ,) pins that window's name permanently.

# ---------------------------------------------------------------------------
# Fuzzy finders (fzf in a popup)
# ---------------------------------------------------------------------------
# F9 + f: find any window across all sessions by name / index / running command
bind-key f display-popup -w 60% -h 40% -E "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name} [#{pane_current_command}]' | fzf --reverse --prompt='window> ' | cut -d' ' -f1 | xargs -r tmux switch-client -t"

# F9 + s: switch session by name (overrides default session tree)
bind-key s display-popup -w 60% -h 40% -E "tmux list-sessions -F '#{session_name}' | fzf --reverse --prompt='session> ' | xargs -r tmux switch-client -t"

# Jump to previously selected window (last-window)
bind-key u last-window

# Open panes same directory
bind '"' split-window -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# Archive current window to the shared "archive" session (recreated on demand)
# F9 + a: move current window into archive; refuses to move the last window
# Source is captured explicitly: new-session re-selects the current session,
# so a bare move-window -t would target the anchor window instead of the user's.
bind-key a run-shell '\
  SESS="$(tmux display-message -p -F "#{session_name}")"; \
  WIN="$(tmux display-message -p -F "#{window_index}")"; \
  NW="$(tmux display-message -p -F "#{session_windows}")"; \
  if [ "$NW" -eq 1 ]; then \
    tmux display-message "refusing: last window of session"; \
  elif tmux has-session -t archive 2>/dev/null; then \
    tmux move-window -s "$SESS:$WIN" -t archive; \
  else \
    tmux new-session -d -s archive -n __anchor__; \
    tmux move-window -s "$SESS:$WIN" -k -t archive:0; \
    tmux kill-window -t archive:__anchor__ 2>/dev/null; \
  fi'

# F9 + A: unarchive current window back to the session you came from
bind-key A run-shell '\
  DEST="$(tmux display-message -p -F "#{client_last_session}")"; \
  SESS="$(tmux display-message -p -F "#{session_name}")"; \
  WIN="$(tmux display-message -p -F "#{window_index}")"; \
  if [ -n "$DEST" ]; then \
    tmux move-window -s "$SESS:$WIN" -t "$DEST"; \
  else \
    tmux display-message "no previous session to unarchive to"; \
  fi'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
set -g extended-keys on
