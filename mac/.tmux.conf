# Use caps lock as prefix
# Caps Lock is remapped to F9 via hidutil LaunchAgent at ~/Library/LaunchAgents/com.user.capslock-remap.plist
# To apply manually: hidutil property --set '{"UserKeyMapping":[{"HIDKeyboardModifierMappingSrc":0x700000039,"HIDKeyboardModifierMappingDst":0x700000042}]}'
source-file ~/.config/tmux/keys.conf

# Fix problem with vim within tmux
set -s escape-time 0

# Truecolor support (required for themes to use hex colors correctly)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:Tc"

# Use CSI-u key encoding, which pi works best with (not xterm)
set -g extended-keys-format csi-u

# Set scroll via mouse/touchpad
set -g mouse on

# Increase history limit
set-option -g history-limit 100000

source-file ~/.config/tmux/plugins.conf
# Commands resurrect may replay into their restored pane; anything else comes
# back as the directory only.
set -g @resurrect-processes 'pi claude codex nvim vim ssh'

# ---------------------------------------------------------------------------
# Budapest day theme (brand palette; light and pastel, terracotta accent)
# ---------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#F6F1E7,fg=#3A3A3A"

set -g status-interval 1
set -g status-left-length 40
set -g status-right-length 60
set -g status-left " #[fg=#A8432C,bold]#S#[default] "
set -g status-right "#[fg=#6F675C]#{battery_icon} #{battery_percentage}  #[fg=#3A3A3A]%H:%M:%S #[fg=#6F675C]%d-%b "

set -g window-status-format " #I:#W "
set -g window-status-style "fg=#6F675C"
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#a8432c,fg=#fff8ee,bold"
# Bell flags reuse this style (window-status-bell-style unset): pi's ask-user-question
# package emits one BEL when a questionnaire waits, claude rings its own terminal_bell.
set -g window-status-activity-style "fg=#A8432C"
set -g window-status-separator ""

set -g pane-border-style "fg=#E6DCCB"
set -g pane-active-border-style "fg=#A8432C"
set -g message-style "bg=#A8432C,fg=#FFF8EE,bold"
set -g mode-style "bg=#C9D9E8,fg=#3A3A3A"
set -g clock-mode-colour "#A8432C"
set -g popup-style "bg=#f6f1e7,fg=#3a3a3a"
set -g popup-border-style "bg=#f6f1e7,fg=#a8432c"
# fzf runs inside the popups; match its colors to the theme
set-environment -g FZF_DEFAULT_OPTS "--color=light,bg:-1,gutter:-1,fg:#3a3a3a,fg+:#3a3a3a,bg+:#e6dccb,hl:#a8432c,hl+:#a8432c,prompt:#a8432c,pointer:#a8432c,marker:#a8432c,info:#6f675c,border:#e6dccb"

# ---------------------------------------------------------------------------
# Window naming
# ---------------------------------------------------------------------------
# Apps cannot rename windows via escape sequences (stops Claude/vim title churn)
set -g allow-rename off
# tmux names windows itself from the running command; changes only on command change
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
# A manual rename (F9 ,) pins that window's name permanently.

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
set -g extended-keys on
